<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="100%" height="100%" style="background-color: #f8f9fa; font-family: 'Segoe UI', Arial, sans-serif;">
  
  <!-- Tarjeta Contenedora Principal -->
  <rect x="20" y="20" width="960" height="710" rx="10" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.5" filter="drop-shadow(0px 8px 16px rgba(0,0,0,0.1))"/>
  
  <!-- Borde Superior de Marca -->
  <rect x="20" y="20" width="960" height="10" rx="4" fill="#4A0E17"/>

  <!-- Encabezado de la Imagen -->
  <text x="50" y="65" font-size="22" font-weight="bold" fill="#4A0E17">ARQUITECTURA DE CAPAS DE ANÁLISIS</text>
  <text x="50" y="88" font-size="13" fill="#666666">Estructura de Transformación de Datos en Decisiones Estratégicas — Inversora IPSFANB</text>
  
  <rect x="750" y="48" width="190" height="32" rx="6" fill="#4A0E17"/>
  <text x="845" y="69" font-size="11" font-weight="bold" fill="#F1C40F" text-anchor="middle" letter-spacing="1">VENEZUELA RENACE</text>

  <!-- CAPA 4 (PÍRAMIDE / CÚSPIDE): ESTRATÉGICA / DIRECTIVA -->
  <rect x="150" y="125" width="700" height="110" rx="8" fill="#4A0E17" stroke="#D4AF37" stroke-width="2"/>
  <text x="180" y="155" font-size="15" font-weight="bold" fill="#F1C40F">CAPA 4: NIVEL ESTRATÉGICO Y TOMADORES DE DECISIÓN</text>
  <text x="180" y="180" font-size="12" fill="#ffffff">• Indicadores Clave: eNPS Interno (+45) e Índice Global de Salud Organizacional (ICSO: 4.15).</text>
  <text x="180" y="202" font-size="12" fill="#ffffff">• Entregable: Reporte Ejecutivo para la Alta Dirección y Matriz de Compromisos Institucionales.</text>

  <!-- Flecha de Subida 3 a 4 -->
  <path d="M 500 245 L 500 260" stroke="#4A0E17" stroke-width="3" marker-end="url(#arrow)" fill="none"/>

  <!-- CAPA 3: DIAGNÓSTICO CUALITATIVO Y RECOMENDACIONES -->
  <rect x="110" y="265" width="780" height="110" rx="8" fill="#fdfdfd" stroke="#27ae60" stroke-width="2"/>
  <text x="140" y="295" font-size="15" font-weight="bold" fill="#27ae60">CAPA 3: ANÁLISIS CUALITATIVO Y DE SENTIMIENTO (TEXTO LIBRE)</text>
  <text x="140" y="320" font-size="12" fill="#2c3e50">• Evaluación de ítems abiertos de alto impacto: Fortalezas (P69), Áreas de Mejora (P70) y Burocracia (P71).</text>
  <text x="140" y="342" font-size="12" fill="#555555">• Agrupación temática mediante procesamiento de lenguaje para detectar cuellos de botella operativos.</text>

  <!-- Flecha de Subida 2 a 3 -->
  <path d="M 500 385 L 500 400" stroke="#4A0E17" stroke-width="3" stroke-dasharray="4"/>

  <!-- CAPA 2: SEGMENTACIÓN DEMOGRÁFICA Y TERRITORIAL -->
  <rect x="80" y="405" width="840" height="110" rx="8" fill="#fdfdfd" stroke="#3b5998" stroke-width="2"/>
  <text x="110" y="435" font-size="15" font-weight="bold" fill="#3b5998">CAPA 2: SEGMENTACIÓN DEMOGRÁFICA Y TÁCTICA</text>
  <text x="110" y="460" font-size="12" fill="#2c3e50">• Cruce multidimensional por Organización (Inversora, IPSFANBMIL, IPSFA), Gerencia y Nivel Jerárquico.</text>
  <text x="110" y="482" font-size="12" fill="#555555">• Análisis territorial distribuido a través de los 23 Estados, Distrito Capital y La Guaira.</text>

  <!-- Flecha de Subida 1 a 2 -->
  <path d="M 500 525 L 500 540" stroke="#4A0E17" stroke-width="3" stroke-dasharray="4"/>

  <!-- CAPA 1 (BASE DE LA PIRÁMIDE): DATOS RECOLECTADOS EN CAMPO -->
  <rect x="50" y="545" width="900" height="110" rx="8" fill="#f4f7f6" stroke="#95a5a6" stroke-width="1.5"/>
  <text x="80" y="575" font-size="15" font-weight="bold" fill="#2c3e50">CAPA 1: DATOS PRIMARIOS Y RESPUESTAS BÁSICAS (BASE BD)</text>
  <text x="80" y="600" font-size="12" fill="#555555">• Recolección de 68 reactivos cuantitativos en escala Likert (1 a 5 y N/A) agrupados en 9 dimensiones.</text>
  <text x="80" y="622" font-size="12" fill="#555555">• Almacenamiento seguro e inalterable en Supabase en formato JSONB con políticas RLS de anonimato.</text>

  <!-- NOTA PIE -->
  <text x="50" y="695" font-size="11" fill="#777777" italic="true">* Modelo en capas que garantiza la trazabilidad metodológica desde el dato anónimo individual hasta la decisión corporativa.</text>

</svg>
