<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%" style="background-color: #f8f9fa; font-family: 'Segoe UI', Arial, sans-serif;">
  
  <rect x="20" y="20" width="960" height="660" rx="10" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.5" filter="drop-shadow(0px 8px 16px rgba(0,0,0,0.1))"/>
  <rect x="20" y="20" width="960" height="10" rx="4" fill="#4A0E17"/>

  <text x="50" y="65" font-size="22" font-weight="bold" fill="#4A0E17">1. MÉTRICAS DE GESTIÓN DEL PROYECTO (OPERATIVAS)</text>
  <text x="50" y="88" font-size="13" fill="#666666">Control de Ejecución, Cobertura por Sedes y Rendimiento de Campo — Inversora IPSFANB</text>
  
  <rect x="750" y="48" width="190" height="32" rx="6" fill="#4A0E17"/>
  <text x="845" y="69" font-size="11" font-weight="bold" fill="#F1C40F" text-anchor="middle" letter-spacing="1">VENEZUELA RENACE</text>

  <!-- MÉTRICA 1: TPG -->
  <rect x="50" y="125" width="900" height="110" rx="8" fill="#fdfdfd" stroke="#4A0E17" stroke-width="1.5"/>
  <rect x="50" y="125" width="10" height="110" fill="#4A0E17"/>
  <text x="80" y="155" font-size="15" font-weight="bold" fill="#4A0E17">TASA DE PARTICIPACIÓN GLOBAL (TPG)</text>
  <text x="80" y="180" font-size="12" fill="#2c3e50">Fórmula: TPG = (Total Encuestas Completadas / Total Personal en Nómina) × 100</text>
  <text x="80" y="202" font-size="12" fill="#555555">• Mide el nivel de respuesta efectiva alcanzado en la Inversora IPSFANB, IPSFANBMIL e IPSFA.</text>
  <rect x="760" y="155" width="160" height="50" rx="6" fill="#4A0E17"/>
  <text x="840" y="178" font-size="10" fill="#D4AF37" text-anchor="middle" font-weight="bold">META OPERATIVA</text>
  <text x="840" y="196" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">≥ 75% Participación</text>

  <!-- MÉTRICA 2: TASA DE CONVERSIÓN -->
  <rect x="50" y="250" width="900" height="110" rx="8" fill="#fdfdfd" stroke="#3b5998" stroke-width="1.5"/>
  <rect x="50" y="250" width="10" height="110" fill="#3b5998"/>
  <text x="80" y="280" font-size="15" font-weight="bold" fill="#3b5998">TASA DE CONVERSIÓN Y FINALIZACIÓN DE FORMULARIO</text>
  <text x="80" y="305" font-size="12" fill="#2c3e50">Fórmula: TCF = (Encuestas Enviadas / Sesiones de Encuesta Iniciadas) × 100</text>
  <text x="80" y="327" font-size="12" fill="#555555">• Evalúa la usabilidad del sistema web y descarta fricción durante el llenado.</text>
  <rect x="760" y="280" width="160" height="50" rx="6" fill="#3b5998"/>
  <text x="840" y="303" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="bold">META OPERATIVA</text>
  <text x="840" y="321" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">≥ 90% Compleción</text>

  <!-- MÉTRICA 3: COBERTURA POR SEDES -->
  <rect x="50" y="375" width="900" height="110" rx="8" fill="#fdfdfd" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="50" y="375" width="10" height="110" fill="#27ae60"/>
  <text x="80" y="405" font-size="15" font-weight="bold" fill="#27ae60">COBERTURA COOPERATIVA Y SUCURSALES</text>
  <text x="80" y="430" font-size="12" fill="#2c3e50">Indicador: Cobertura del 100% de las Sedes Centrales, Sucursales y Tiendas Regionales</text>
  <text x="80" y="452" font-size="12" fill="#555555">• Asegura que todas las unidades de la Inversora IPSFANB tengan representatividad equivalente.</text>
  <rect x="760" y="405" width="160" height="50" rx="6" fill="#27ae60"/>
  <text x="840" y="428" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="bold">META OPERATIVA</text>
  <text x="840" y="446" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">100% Sedes</text>

  <!-- MÉTRICA 4: EFECTIVIDAD CUALITATIVA -->
  <rect x="50" y="500" width="900" height="110" rx="8" fill="#fdfdfd" stroke="#D4AF37" stroke-width="1.5"/>
  <rect x="50" y="500" width="10" height="110" fill="#D4AF37"/>
  <text x="80" y="530" font-size="15" font-weight="bold" fill="#B8860B">EFECTIVIDAD CUALITATIVA (PREGUNTA ABIERTA)</text>
  <text x="80" y="555" font-size="12" fill="#2c3e50">Fórmula: TEC = (Respuestas Validadas en P69-P71 / Total Formularios Enviados) × 100</text>
  <text x="80" y="577" font-size="12" fill="#555555">• Mide el volumen de aportes cualitativos útiles sobre fortalezas, mejoras y burocracia.</text>
  <rect x="760" y="530" width="160" height="50" rx="6" fill="#D4AF37"/>
  <text x="840" y="553" font-size="10" fill="#4A0E17" text-anchor="middle" font-weight="bold">META OPERATIVA</text>
  <text x="840" y="571" font-size="16" fill="#4A0E17" text-anchor="middle" font-weight="bold">≥ 80% Aportes</text>

  <text x="50" y="645" font-size="11" fill="#777777" italic="true">* Métricas monitoreadas diariamente desde el Panel de Administración de Supabase durante el levantamiento.</text>

</svg>
